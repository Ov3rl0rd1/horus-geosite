name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to build, empty for the latest one"
  schedule:
    - cron: "0 0 * * *"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23
      - name: Test
        run: go test ./...
      - name: Build geosite.dat
        id: build
        run: go run -v .
        env:
          FIXED_RELEASE: ${{ github.event.inputs.tag }}
      - name: Generate sha256 hash
        run: sha256sum geosite.dat > geosite.dat.sha256sum
      - name: Push the release branch
        run: .github/release-branch.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.2
        with:
          keep_latest: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release geosite.dat
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          files: |
            geosite.dat
            geosite.dat.sha256sum
